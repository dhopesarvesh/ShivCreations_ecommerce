services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rangoli_store
      POSTGRES_USER: rangoli
      POSTGRES_PASSWORD: rangoli_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rangoli -d rangoli_store"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Rangoli Store
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql://rangoli:rangoli_password@db:5432/rangoli_store
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
