services:
  - type: web
    name: shivcreations-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Rangoli Store
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: shivcreations-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: shivcreations-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: /api/v1

databases:
  - name: shivcreations-db
    plan: free
